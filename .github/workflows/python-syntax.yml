name: Dashboard Python checks

on:
  push:
    branches:
      - main
      - research/volatility-transition-response-dashboard-20261119
      - research/volatility-response-calendar-robustness-dashboard-20261119
      - research/volatility-response-uncertainty-dashboard-20261119
      - research/volatility-response-uncertainty-dashboard-20261119
      - research/volatility-response-calendar-robustness-dashboard-20261119
      - research/volatility-classification-sensitivity-dashboard-20261119
      - research/volatility-classification-full-history-dashboard-20261119
  pull_request:
    branches:
      - main
      - research/volatility-transition-response-dashboard-20261119

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile dashboard modules
        run: python -m py_compile app.py validation_diagnostics.py
      - name: Run validation helper tests
        run: python -m unittest discover -s tests -v
