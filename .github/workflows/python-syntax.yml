name: Dashboard Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Compile dashboard modules
        run: python -m py_compile app.py validation_diagnostics.py
      - name: Run validation helper tests
        run: python -m unittest discover -s tests -v
