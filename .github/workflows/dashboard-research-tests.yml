name: Dashboard research tests

on:
  pull_request:
    paths:
      - "app.py"
      - "validation_diagnostics.py"
      - "tests/**"
      - ".github/workflows/dashboard-research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research test dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Compile dashboard and diagnostics
        run: python -m py_compile app.py validation_diagnostics.py
      - name: Run validation diagnostics tests
        run: python -m unittest discover -s tests -p "test_validation_diagnostics.py" -v
